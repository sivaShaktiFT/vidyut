[package]
edition = "2021"
name = "vidyut"
version = "0.1.0"
authors = ["Arun Prasad <ambuda.library@gmail.com>"]
description = "A Sanskrit toolkit"
homepage = "https://github.com/ambuda-org/vidyut"
keywords = ["sanskrit"]
categories = ["text-processing"]
license = "MIT"
repository = "https://github.com/ambuda-org/vidyut"

[dependencies]
csv = "1.1.6"
glob = "0.3.1"
multimap = "0.8.3"

[dependencies.vidyut-chandas]
path = "./vidyut-chandas"

[dependencies.vidyut-cheda]
path = "./vidyut-cheda"

[dependencies.vidyut-data]
path = "./vidyut-data"

[dependencies.vidyut-kosha]
path = "./vidyut-kosha"

[dependencies.vidyut-lipi]
path = "./vidyut-lipi"

[dependencies.vidyut-prakriya]
path = "./vidyut-prakriya"

[dependencies.vidyut-sandhi]
path = "./vidyut-sandhi"

[workspace]
members = [
    "bindings-python",
    "bindings-ts",
    "vidyut-akshara",
    "vidyut-chandas",
    "vidyut-cheda",
    "vidyut-data",
    "vidyut-kosha",
    "vidyut-lipi",
    "vidyut-prakriya",
    "vidyut-sandhi",
]

[workspace.dependencies]
clap = "4.1.4"
env_logger = "0.11.6"
log = "0.4.22"
rayon = "1.6.1"
rmp-serde = "1.3.0"
rustc-hash = "2.1.0"
serde = "1.0.217"

[profile.release]
# The browser package is built from this workspace, so release-size policy must live here.
debug = 0
incremental = false
opt-level = "s"
